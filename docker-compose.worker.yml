version: '3.8'

services:
  # Example: Multiple workers that can connect to an orchestrator
  
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=worker-1
      - WORKER_PORT=8080
      - WORKER_HOST=worker-1
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:4000}
      - SHARED_SECRET=${SHARED_SECRET:-dev-secret-key}
      - MODEL=models/ggml-base.en.bin
      - WHISPER_BIN=/whisper.cpp/build/bin/whisper-server
      - HEARTBEAT_INTERVAL=20
    ports:
      - "8081:8080"
    volumes:
      - ./models:/whisper.cpp/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=worker-2
      - WORKER_PORT=8080
      - WORKER_HOST=worker-2
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:4000}
      - SHARED_SECRET=${SHARED_SECRET:-dev-secret-key}
      - MODEL=models/ggml-base.en.bin
      - WHISPER_BIN=/whisper.cpp/build/bin/whisper-server
      - HEARTBEAT_INTERVAL=20
    ports:
      - "8082:8080"
    volumes:
      - ./models:/whisper.cpp/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Note: Orchestrator is a separate Phoenix/Elixir application
  # See WORKER_SYSTEM.md for implementation details
  
  # orchestrator:
  #   image: whisper-orchestrator:latest
  #   environment:
  #     - WORKER_SHARED_SECRET=${SHARED_SECRET:-dev-secret-key}
  #     - SECRET_KEY_BASE=${SECRET_KEY_BASE:-your-secret-key-base}
  #   ports:
  #     - "4000:4000"
  #   restart: unless-stopped

# For standalone workers without orchestrator, comment out ORCHESTRATOR_URL
# and remove orchestrator service dependency

