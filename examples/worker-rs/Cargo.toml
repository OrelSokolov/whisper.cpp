[package]
name = "whisper-worker-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
base64 = "0.21"
sha1 = "0.10"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
tempfile = "3.8"
symphonia = { version = "0.5", features = ["all"] }

[build-dependencies]
cc = "1.0"

