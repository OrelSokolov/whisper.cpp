[package]
name = "corpus-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.8"
md5 = "0.7"

# For native audio processing (FAST!)
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"  # Fast WAV writing
rubato = "0.15"  # Resampling

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

